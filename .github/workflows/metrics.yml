name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 * * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:

  achievements:
    runs-on: ubuntu-latest
    # Fork jobs rebuild the Docker image; apt occasionally hangs, so fail fast and let the next hourly run retry
    timeout-minutes: 25
    steps:
      # Reuse the image published by jnbdz/metrics (workflow: publish-fork-image).
      # The action rebuilds a forked image unless one is already tagged locally, and that
      # build costs ~9 minutes and intermittently hangs; falling back to it is harmless.
      - name: Use prebuilt fork image
        continue-on-error: true
        run: |
          IMAGE=ghcr.io/jnbdz/metrics:forked-3.35.0-beta
          docker pull "$IMAGE" && docker tag "$IMAGE" metrics:forked-3.35.0-beta
      # Fork pin: upstream master + lowlighter/metrics#1834 (projectsV2 + null commit guards) + repositories pagination fix
      - uses: jnbdz/metrics@f70a440e88d4a0db9f954be6e6a1d2e33db171ff
        with:
          filename: achievements.svg
          repositories: 1000          # Count all owned repositories, not just the 100 most recent
          repositories_batch: 50      # 100 per query times out on the GraphQL API
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: jnbdz
          base: achievements
          plugin_achievements: yes
          plugin_achievements_threshold: B      # Display achievements with rank B or higher
          plugin_achievements_secrets: yes      # Display unlocked secrets achievements
          plugin_achievements_display: compact  # Use compact display
          plugin_achievements_limit: 0          # Display all unlocked achievements (no limit)

  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: header.svg
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_SECRET }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: jnbdz
          template: classic
          base: header
          config_timezone: ${{ secrets.USER_TIMEZONE }}
  lines:
    runs-on: ubuntu-latest
    # Fork jobs rebuild the Docker image; apt occasionally hangs, so fail fast and let the next hourly run retry
    timeout-minutes: 25
    steps:
      # Reuse the image published by jnbdz/metrics (workflow: publish-fork-image).
      # The action rebuilds a forked image unless one is already tagged locally, and that
      # build costs ~9 minutes and intermittently hangs; falling back to it is harmless.
      - name: Use prebuilt fork image
        continue-on-error: true
        run: |
          IMAGE=ghcr.io/jnbdz/metrics:forked-3.35.0-beta
          docker pull "$IMAGE" && docker tag "$IMAGE" metrics:forked-3.35.0-beta
      # Fork pin: upstream master + lowlighter/metrics#1834 + repositories pagination fix (upstream loads 0 repos on API timeout)
      - uses: jnbdz/metrics@f70a440e88d4a0db9f954be6e6a1d2e33db171ff
        with:
          filename: lines-of-code.svg
          repositories: 1000          # Count all owned repositories, not just the 100 most recent
          repositories_batch: 50      # 100 per query times out on the GraphQL API
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: jnbdz
          base: "repositories"
          plugin_lines: yes

  acti_comm:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: acti_comm.svg
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_SECRET }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: jnbdz
          template: classic
          base: activity, community
          config_timezone: ${{ secrets.USER_TIMEZONE }}

  iso_calender:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: iso_calender.svg
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_SECRET }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: jnbdz
          template: classic
          base: ""
          config_timezone: ${{ secrets.USER_TIMEZONE }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

  habits:
    runs-on: ubuntu-latest
    # Fork jobs rebuild the Docker image; apt occasionally hangs, so fail fast and let the next hourly run retry
    timeout-minutes: 25
    steps:
      # Reuse the image published by jnbdz/metrics (workflow: publish-fork-image).
      # The action rebuilds a forked image unless one is already tagged locally, and that
      # build costs ~9 minutes and intermittently hangs; falling back to it is harmless.
      - name: Use prebuilt fork image
        continue-on-error: true
        run: |
          IMAGE=ghcr.io/jnbdz/metrics:forked-3.35.0-beta
          docker pull "$IMAGE" && docker tag "$IMAGE" metrics:forked-3.35.0-beta
      # Fork pin: upstream master + lowlighter/metrics#1834 (projectsV2 + null commit guards) + repositories pagination fix
      - uses: jnbdz/metrics@f70a440e88d4a0db9f954be6e6a1d2e33db171ff
        with:
          filename: github-habits.svg
          repositories: 1000          # Count all owned repositories, not just the 100 most recent
          repositories_batch: 50      # 100 per query times out on the GraphQL API
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          config_timezone: ${{ secrets.USER_TIMEZONE }} # Set timezone
          user: jnbdz
          base: ""
          template: classic
          plugin_habits: yes
          plugin_habits_from: 200       # Use 200 events to compute habits
          plugin_habits_days: 14        # Keep only events from last 14 days
          plugin_habits_charts: yes     # Display charts section
          plugin_habits_trim: yes       # Trim unused hours on daily chart

  issue_pr_lang:
    runs-on: ubuntu-latest
    # Fork jobs rebuild the Docker image; apt occasionally hangs, so fail fast and let the next hourly run retry
    timeout-minutes: 25
    steps:
      # Reuse the image published by jnbdz/metrics (workflow: publish-fork-image).
      # The action rebuilds a forked image unless one is already tagged locally, and that
      # build costs ~9 minutes and intermittently hangs; falling back to it is harmless.
      - name: Use prebuilt fork image
        continue-on-error: true
        run: |
          IMAGE=ghcr.io/jnbdz/metrics:forked-3.35.0-beta
          docker pull "$IMAGE" && docker tag "$IMAGE" metrics:forked-3.35.0-beta
      # Fork pin: upstream master + lowlighter/metrics#1834 + repositories pagination fix (upstream loads 0 repos on API timeout)
      - uses: jnbdz/metrics@f70a440e88d4a0db9f954be6e6a1d2e33db171ff
        with:
          filename: issue_pr_lang.svg
          repositories: 1000          # Count all owned repositories, not just the 100 most recent
          repositories_batch: 50      # 100 per query times out on the GraphQL API
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_SECRET }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: jnbdz
          template: classic
          base: ""
          config_timezone: ${{ secrets.USER_TIMEZONE }}
          plugin_followup: yes
          plugin_followup_sections: repositories, user  # Also show issues/PRs you opened elsewhere
          plugin_languages: yes


  repositories:
    runs-on: ubuntu-latest
    # Fork jobs rebuild the Docker image; apt occasionally hangs, so fail fast and let the next hourly run retry
    timeout-minutes: 25
    steps:
      # Reuse the image published by jnbdz/metrics (workflow: publish-fork-image).
      # The action rebuilds a forked image unless one is already tagged locally, and that
      # build costs ~9 minutes and intermittently hangs; falling back to it is harmless.
      - name: Use prebuilt fork image
        continue-on-error: true
        run: |
          IMAGE=ghcr.io/jnbdz/metrics:forked-3.35.0-beta
          docker pull "$IMAGE" && docker tag "$IMAGE" metrics:forked-3.35.0-beta
      # Fork pin: upstream master + lowlighter/metrics#1834 + repositories pagination fix (upstream loads 0 repos on API timeout)
      - uses: jnbdz/metrics@f70a440e88d4a0db9f954be6e6a1d2e33db171ff
        with:
          filename: repositories.svg
          repositories: 1000          # Count all owned repositories, not just the 100 most recent
          repositories_batch: 50      # 100 per query times out on the GraphQL API
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_SECRET }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: jnbdz
          template: classic
          base: repositories
          config_timezone: ${{ secrets.USER_TIMEZONE }}

